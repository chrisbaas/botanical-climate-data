name: Inspect 1991–2020 climate file
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_terraclimate_file.py
      - .github/workflows/audit-climate-file.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'netCDF4>=1.7,<2'
      - run: python scripts/audit_terraclimate_file.py
